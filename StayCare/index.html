    content="StayFresh | StayCare | Malta Laundry, Airbnb Cleaning Services & Commercial Cleaners">

  <!-- Structured Data (JSON-LD) for LocalBusiness / Laundry & Cleaning Services in Malta -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "DryCleaningOrLaundry",
      "name": "StayFresh | StayCare Group - Malta Laundry & Cleaning Services",
      "url": "https://app.staycaregroup.com/",
      "logo": "https://app.staycaregroup.com/brand/logo.png",
      "image": "https://app.staycaregroup.com/brand/logo.png",
      "description": "Professional commercial laundry management, dry cleaning, Airbnb turnover cleaning, and linen care services across Malta.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "MT",
        "addressLocality": "Malta"
      },
      "areaServed": {
        "@type": "AdministrativeArea",
        "name": "Malta"
      },
      "serviceType": [
        "Malta Laundry Service",
        "Malta Lavanderia",
        "Airbnb Cleaning Malta",
        "Airbnb Clean & Turnover",
        "Commercial Cleaners Malta",
        "Linen Management & Dry Cleaning",
        "Laundry Pickup and Delivery"
      ],
      "sameAs": [
        "https://app.staycaregroup.com/"
      ]
    }
    </script>
</head>

<body>
  <div id="app">
    <style>
      .app-initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #F3F4F5;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #0d365f;
      }

      .app-initial-loader .logo-container {
        margin-bottom: 24px;
        animation: pulse-logo 2s ease-in-out infinite;
      }

      .app-initial-loader .logo-img {
        height: 60px;
        width: auto;
        object-fit: contain;
      }

      .app-initial-loader .spinner {
        width: 38px;
        height: 38px;
        border: 3.5px solid rgba(13, 54, 95, 0.15);
        border-top-color: #0d365f;
        border-radius: 50%;
        animation: spin-loader 0.8s linear infinite;
        margin-bottom: 16px;
      }

      .app-initial-loader .loader-text {
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.5px;
        color: #4b5563;
        margin: 0;
      }

      .app-initial-loader .waking-server-text {
        font-size: 12px;
        color: #6b7280;
        margin-top: 8px;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
      }

      .app-initial-loader .waking-server-text.visible {
        opacity: 1;
      }

      @keyframes spin-loader {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse-logo {

        0%,
        100% {
          transform: scale(1);
          opacity: 0.95;
        }

        50% {
          transform: scale(1.03);
          opacity: 1;
        }
      }
    </style>
    <div class="app-initial-loader">
      <div class="logo-container">
        <img src="/brand/logo.png" alt="StayCare Logo" class="logo-img" onerror="this.style.display='none'">
      </div>
      <div class="spinner"></div>
      <p class="loader-text">StayFresh</p>
      <p id="waking-server-msg" class="waking-server-text">Connecting to server, please wait...</p>
    </div>
    <script>
      setTimeout(function () {
        var el = document.getElementById('waking-server-msg');
        if (el) el.classList.add('visible');
      }, 3000);
    </script>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
